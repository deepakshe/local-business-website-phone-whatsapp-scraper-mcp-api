# Smithery.ai MCP Server Manifest
name: local-business-website-phone-whatsapp-scraper-mcp-api
version: 1.0.0
description: "Extract direct landlines, mobile numbers, WhatsApp click-to-chat links, and contact emails from local business websites. Built for local agency lead generation."
startCommand:
  type: stdio
  config:
    command: npx
    args:
      - "-y"
      - "@apify/actors-mcp-server"
      - "--actors"
      - "deepaksheoran172/local-business-website-phone-whatsapp-scraper"
    env:
      APIFY_TOKEN:
        type: string
        description: "Your Apify API Token ($5/month free credits included)"
        required: true
